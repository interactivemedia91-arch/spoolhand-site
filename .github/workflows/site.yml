# Tests and builds spoolhand.app, then deploys it to GitHub Pages. Runs on every push to main.
# A failed test or build keeps the last deployed site, and GitHub emails the repo owner.
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Test the calculators
        run: node --test tests/fit.test.mjs tests/parse.test.mjs tests/solve.test.mjs

      - name: Test the build
        run: python3 -I -m unittest discover -s tests -p 'test_*.py'

      - name: Build
        run: python3 -I tools/build.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
